l_english:

    LUS_EMPIRE:0 "Congress of Coimbra"
    gov_lusitanian_admiralty:0 "Almirantado Junta"
    RULER_TITLE_GRAND_ADMIRAL:0 "Grand Admiral"
    LUS_LORD_ADMIRAL:0 "Lord Admiral"
    LUS_LADY_ADMIRAL:0 "Lady Admiral"
    law_almirantado_junta:0 "Almirantado Junta"
    law_almirantado_junta_desc:0 "The Almirantado Junta establishes a political order dominated by the Grand Admiral and the naval high command. Aristocratic families and wealthy commercial interests retain considerable influence, but the Officer Corps forms the backbone of the state."
    law_nueva_encomienda:0 "Nueva Encomienda"
    law_nueva_encomienda_desc:0 "The Nueva Encomienda law restructures land ownership, granting military officials and large landowners significant control over agricultural production while imposing obligations on tenant farmers. It aims to balance the interests of the landed elite with the economic needs of the state."

    gov_lusitanian_viceroyalty:0 "Viceroyalty"
    gov_lusitanian_viceroyalty_desc:0 "A colonial territory administered on behalf of the Lusitanian crown."
    gov_lusitanian_governorship:0 "Viceroyalty"
    gov_lusitanian_governorship_desc:0 "A colonial territory administered on behalf of the Lusitanian crown."
    RULER_TITLE_LUS_VICEROY:0 "Viceroy"
    RULER_TITLE_LUS_VICEREINE:0 "Vicereine"
    RULER_TITLE_LUS_GOVERNOR:0 "Governor"
    RULER_TITLE_LUS_GOVERNESS:0 "Governess"

    JAP_EMPIRE:0 "Tōyō Shōsha Jōyaku"
    law_choninbakufu:0 "Chōninbakufu"
    law_choninbakufu_desc:0 "After the overthrow of the traditional shogunate, powerful merchant houses established an autocratic order of their own. Industrial magnates and wealthy landowners dominate the state, while the old military elite no longer holds the same privileged position."
    law_kabunakama:0 "Kabunakama"
    law_kabunakama_desc:0 "Privileged merchant associations preserve the traditional economic order while concentrating investment and influence in the great zaibatsu. Small merchants are shut out of the system, and the state relies on private capital despite the limitations of its traditional administration."
    gov_chonininate:0 "Chōninate"
    gov_chonininate_desc:0 "A Japanese merchant shogunate in which the great commercial houses and landed aristocracy govern under the authority of the Tōryō."
    RULER_TITLE_TORYO:0 "Tōryō"
    HEIR_TITLE_WAKATORYO:0 "Waka-Tōryō"
    ig_buddhist_monks:0 "Sōryo"

    ideology_daimyo_traditionalism:0 "Gōshō Traditionalism"
    ideology_daimyo_traditionalism_desc:0 "#lore The traditional aristocracy believes that Japan's prosperity and stability depend upon the preservation of hereditary authority, feudal obligations and the established social hierarchy. The merchant houses may accumulate wealth, provided they remain within the political order established by the Shogunate.#!"
    ideology_merchant_oligarchy:0 "Zaibatsu Chōnindō"
    ideology_merchant_oligarchy_desc:0 "#lore The great merchant houses believe that wealth and commercial influence should form the foundation of political power. They support the Shogunate as the guarantor of privileged commerce, protected monopolies and private accumulation of capital, opposing democratic interference in the established economic order.#!"

    law_beit_avadim:0 "Beit Avadim"
    law_beit_avadim_desc:0 "A specialized servitude law unique to Egypt targeting adherents of the Jewish faith."
    beit_avadim_enslave_jewish_pops_tt:0 "Enslaves eligible [GetReligion('jewish').GetName] pops across your states"

    GREAT_TIANLAN:0 "Great Tiānhlán"
    law_taixue:0 "Taixue"
    law_taixue_desc:0 "Imperial schools and privately supported academies cultivate classical learning and moral discipline. Inspired by Daoshenic traditions, they value education beyond the court, though access remains shaped by wealth and local patronage."
    law_tianlan_system:0 "Tianlan System"
    law_tianlan_system_desc:0 "The imperial court regulates foreign commerce but welcomes merchants who bring useful inventions and knowledge. Foreigners remain outsiders in the eyes of the realm, even as their technology is studied and adopted."
    law_banner_system:0 "Banner System"
    law_banner_system_desc:0 "Hereditary military communities serve under banners commanded by privileged officers. Their obligations provide the state with a disciplined but socially restricted force, maintained at greater expense than ordinary levies."
    HUB_NAME_STATE_SUZHOU_city:0 "Tiānlán"
    HUB_NAME_STATE_SUZHOU_port:0 "Tiānhǎi"
    ig_x40_armed_forces:0 "Jūnduì"
    ig_x40_armed_forces_desc:0 "The officer corps commands the armies of the realm. Its generals and military administrators seek a strong state, well-equipped forces and the preservation of military prestige."
    ig_x40_devout:0 "Scholar-Officials"
    ig_x40_devout_desc:0 "The guardians of classical learning, ancestral rites and imperial ceremony uphold the moral foundations of the state. They regard social harmony and respect for established duties as essential to good government."
    ig_x40_industrialists:0 "Gonghang"
    ig_x40_industrialists_desc:0 "The owners of manufactories, mines and industrial enterprises seek to transform the realm through investment and production. They favor the expansion of commerce, modern infrastructure and the influence of private enterprise."
    ig_x40_intelligentsia:0 "Literati"
    ig_x40_intelligentsia_desc:0 "The realm's writers, teachers and educated reformers debate the principles of good government. Drawing upon both classical scholarship and new ideas, they serve as advisers to authority and critics of its abuses."
    ig_x40_landowners:0 "Inner Court"
    ig_x40_landowners_desc:0 "The Inner Court consists of the Directorate of Ceremonial, Imperial Silk, Imperial Secretariat and other key administrative bodies that manage the affairs of the court."
    ig_x40_petty_bourgeoisie:0 "Xiǎozī"
    ig_x40_petty_bourgeoisie_desc:0 "Shopkeepers, lesser merchants, clerks and urban professionals form the respectable middle strata of the realm's towns and cities. They prize property, public order and the promise of advancement through diligence."
    ig_x40_rural_folk:0 "Nóngmín"
    ig_x40_rural_folk_desc:0 "The cultivators, tenant farmers and village households sustain the realm through their labor on the land. They seek secure livelihoods, relief from excessive burdens and protection for their rural communities."
    ig_x40_trade_unions:0 "Gung-Ho"
    ig_x40_trade_unions_desc:0 "The associations of industrial workers and organized labor give a collective voice to those who work in the realm's workshops, factories and mines. They demand fair wages, safer conditions and a greater share in the prosperity they create."

    HOLY_ROMAN_CONFEDERATION:0 "Holy Roman Confederation"

    ALBAN_EMPIRE:0 "Albanic Concordat"

    IDN_EMPIRE:0 "Pacifische Zeekaarten"

    gov_pharonic:0 "Pharaonic Monarchy"
    gov_pharonic_desc:0 "The ruler holds supreme authority as Pharaoh, overseeing both the state and religious institutions."
    RULER_TITLE_PHARAOH:0 "Pharaoh"
    RULER_TITLE_PHARAOHESS:0 "Pharaohess"
    RULER_TITLE_PHARAOH_HEIR:0 "Sanesu"
    RULER_TITLE_PHARAOHESS_HEIR:0 "Satnesu"

    intervene_in_war.tt:0 "Join any [concept_war] where [SCOPE.sCountry('target_country_scope').GetName] is the [concept_war_leader]"
    intervene_in_war.ttt:0 "Must not have a [concept_truce] with any potential enemy" 
    intervene_in_war:0 "Intervene in War"
    intervene_in_war_action_name:0 "Join the [TARGET_COUNTRY.GetAdjective] War"
    intervene_in_war_desc:0 "This [concept_diplomatic_action] allows the initiator to join any [concept_war] where the target country is the [concept_war_leader]."
    intervene_in_war_action_notification_name:0 "[INITIATOR_COUNTRY.GetAdjective] Intervention in [TARGET_COUNTRY.GetName]"
    intervene_in_war_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] has announced that it will give full military support to [TARGET_COUNTRY.GetName] in its war. The [INITIATOR_COUNTRY.GetAdjective] Armed Forces will now join the [TARGET_COUNTRY.GetAdjective] Armed Forces in its military operations."
    intervene_in_war_proposal_notification_name:0 "Proposal for [INITIATOR_COUNTRY.GetName] to intervene"
    intervene_in_war_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] has announced that it wishes to give full military support to us in our war."
    intervene_in_war_proposal_accepted_name:0 "Intervention accepted"
    intervene_in_war_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted our offer to join their war."
    intervene_in_war_proposal_declined_name:0 "Intervention rejected"
    intervene_in_war_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] refused our offer to join their war."
    intervene_in_war_proposal_third_party_accepted_name:0 "[INITIATOR_COUNTRY.GetAdjective] Intervention in [TARGET_COUNTRY.GetNameNoFormatting]"
    intervene_in_war_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted [INITIATOR_COUNTRY.GetName]'s offer to join their war."
    intervene_in_war_proposal_third_party_declined_name:0 "[INITIATOR_COUNTRY.GetAdjective] Intervention refused"
    intervene_in_war_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refused [INITIATOR_COUNTRY.GetName]'s offer to join their war."
    intervene_in_war_action_notification_third_party_name:0 "[INITIATOR_COUNTRY.GetAdjective] Intervention in [TARGET_COUNTRY.GetName]"
    intervene_in_war_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] has announced that it will give full military support to [TARGET_COUNTRY.GetName] in its war. The [INITIATOR_COUNTRY.GetAdjective] Armed Forces will now join the [TARGET_COUNTRY.GetAdjective] Armed Forces in its military operations."
    